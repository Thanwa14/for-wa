<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Wa 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff8fa3;
            --bg-color: #fff0f5; /* ปรับสีพื้นหลังให้อ่อนลงนิดนึงให้ดูแพง */
            --text-color: #594d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            font-family: 'Kanit', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; perspective: 1000px;
        }

        /* --- WOW FACTOR STYLES --- */
        .overlay {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #fff0f5 0%, #ffd1dc 100%); /* พื้นหลังไล่สีสวยๆ */
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); /* เอฟเฟกต์ตอนหายไปแบบสมูทๆ */
        }
        .overlay.hidden {
            opacity: 0;
            transform: scale(1.2); /* ขยายใหญ่ขึ้นตอนหายไป */
            pointer-events: none;
        }

        .gift-container {
            cursor: pointer; text-align: center;
            animation: float 3s ease-in-out infinite; /* กล่องลอยไปมา */
        }
        .gift-emoji {
            font-size: 8rem; display: inline-block;
            transition: transform 0.3s;
            filter: drop-shadow(0 10px 15px rgba(255, 77, 109, 0.4)); /* เงาฟุ้งๆ */
        }
        .gift-container:hover .gift-emoji { transform: scale(1.1) rotate(5deg); }
        .gift-hint {
            margin-top: 20px; font-size: 1.5rem; color: var(--primary-color);
            font-weight: 500; opacity: 0.8;
            animation: pulse 2s infinite;
        }
        
        /* Animation ตอนกดกล่อง */
        .gift-opening { animation: openGift 0.6s forwards; }
        @keyframes openGift {
            0% { transform: scale(1); }
            50% { transform: scale(0.9) rotate(-5deg); } /* หดตัวเตรียมระเบิด */
            100% { transform: scale(3); opacity: 0; } /* ระเบิดหายไป */
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }


        /* --- MAIN CONTENT STYLES --- */
        .container {
            z-index: 10; display: flex; flex-direction: column;
            align-items: center; width: 100%; max-width: 600px;
            opacity: 0; /* ซ่อนไว้ก่อน */
            transition: opacity 1s ease-in 0.5s; /* ค่อยๆ โผล่มาหลังจากกล่องระเบิด */
        }
        .container.visible { opacity: 1; }

        .memory-text {
            font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 400; line-height: 1.6;
            opacity: 0; transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1); /* เด้งดึ๋งนิดๆ */
            color: var(--primary-color); text-align: center; padding: 0 20px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }
        .memory-text.active { opacity: 1; transform: translateY(0); }
        .special-font { font-family: 'Caveat', cursive; font-size: clamp(2.5rem, 7vw, 4rem); color: var(--secondary-color); }

        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white; border: none; padding: 14px 36px; border-radius: 50px;
            font-size: 1.2rem; font-family: inherit; cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 30px rgba(255, 77, 109, 0.6); }

        #final-action { margin-top: 3rem; display: none; text-align: center; animation: fadeInUp 1.5s forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .particle { position: absolute; top: -10%; pointer-events: none; user-select: none; animation: fall linear forwards; z-index: 1; }
        @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }
        #player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <main class="overlay" id="start-overlay">
        <div class="gift-container" onclick="app.openGift(this)">
            <div class="gift-emoji">🎁</div>
            <p class="gift-hint">แตะเพื่อเปิดของขวัญของวา...</p>
        </div>
    </main>

    <div id="player"></div>

    <section class="container" id="main-container">
        <div id="memory-box" style="min-height: 250px; display: flex; align-items: center;">
            <p id="display-text" class="memory-text"></p>
        </div>
        
        <div id="final-action">
            <p style="margin-bottom: 1.5rem; font-size: 1.1rem;">วันนี้เป็นวันที่ดีที่สุดเลย ขอบคุณนะวา</p>
            <button class="btn" onclick="app.finishSurprise()">รักที่สุดเลยคับ 💖</button>
        </div>
    </section>

    <script>
        const app = {
            config: {
                videoId: 'mGUjVbsYG6E',
                textSpeed: 3500
            },
            memories: [
                "วาครับ...", "เซอร์ไพรส์! 🎉", "วันนี้เป็นวันที่ดีจังเลยนะ", 
                "ขอบคุณนะที่วาเลนไทน์ปีนี้มีวาอยู่ข้างๆ", "ถึงจะอยู่ไกลกัน แต่ผมจำได้ทุกความทรงจำเลยนะ", 
                "ขอบคุณที่ยังอยู่ด้วยกันในทุกๆวันนะ", "ผมอยากเป็นรอยยิ้มให้วาในทุกๆ วันเลยยยย", 
                "ไม่อยากให้วาต้องเศร้าหรืออารมณ์เสียกับอะไรอีกเลย", "อยู่เป็นความสุขของกันและกันแบบนี้ไปนานๆ นะ", 
                "<span class='special-font'>Happy Valentine's Day, My Love.</span>"
            ],
            currentIndex: 0,
            player: null,

            init: function() {
                this.loadYouTubeAPI();
                setInterval(() => this.createParticle(), 400); // เริ่มโปรยดอกไม้ตั้งแต่หน้าแรกเลย
            },

            loadYouTubeAPI: function() {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => {
                    this.player = new YT.Player('player', {
                        height: '1', width: '1', videoId: this.config.videoId,
                        playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1, 'loop': 1, 'playlist': this.config.videoId }
                    });
                };
            },

            // ฟังก์ชันใหม่: กดเปิดกล่อง!
            openGift: function(element) {
                // 1. เล่น Animation กล่องระเบิด
                element.classList.add('gift-opening');

                // 2. เริ่มเล่นเพลงทันที (แก้ปัญหามือถือ)
                if (this.player && typeof this.player.playVideo === 'function') {
                    this.player.unMute(); this.player.setVolume(100); this.player.playVideo();
                }

                // 3. รอให้ระเบิดเสร็จ แล้วค่อยๆ เฟดหน้า Overlay ออก
                setTimeout(() => {
                    document.getElementById('start-overlay').classList.add('hidden');
                    // 4. แสดงเนื้อหาหลัก
                    document.getElementById('main-container').classList.add('visible');
                    this.showNextMemory();
                }, 600);
            },

            showNextMemory: function() {
                const textElement = document.getElementById('display-text');
                const finalAction = document.getElementById('final-action');
                if (this.currentIndex < this.memories.length) {
                    textElement.classList.remove('active');
                    setTimeout(() => {
                        textElement.innerHTML = this.memories[this.currentIndex];
                        textElement.classList.add('active');
                        this.currentIndex++;
                        setTimeout(() => this.showNextMemory(), this.config.textSpeed);
                    }, 1000);
                } else {
                    finalAction.style.display = 'block';
                }
            },

            createParticle: function() {
                const particle = document.createElement('div');
                particle.classList.add('particle'); particle.innerHTML = Math.random() > 0.5 ? '🌸' : '💖'; // สลับดอกไม้กับหัวใจ
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 3 + 4}s`;
                particle.style.opacity = (Math.random() * 0.6 + 0.4).toFixed(2);
                particle.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 7000);
            },

            finishSurprise: function() {
                alert('รักกที่สูดดดดดดดดดดดดดดดดดดดดดดดดดด 💖');
                window.close(); window.location.href = 'instagram://';
            }
        };
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
