<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สวนดอกไม้ของวา 🌹💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --env-back: #ffb3c1;
            --env-front-bottom: #ff99ac;
            --env-front-left: #ff8fa3;
            --env-front-right: #ff8fa3;
            --env-flap: #ff758c;
            --bg-color: #fff0f5;
            --primary-text: #ff4d6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* --- 1. ฉากซองจดหมาย 3D --- */
        #delivery-scene {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100;
            transition: opacity 1s ease 1s;
        }
        
        .envelope-wrapper {
            position: relative; width: 320px; height: 200px;
            cursor: pointer; transition: transform 0.4s;
        }
        .envelope-wrapper:hover { transform: translateY(-10px); }

        .envelope {
            position: absolute; width: 100%; height: 100%;
            background-color: var(--env-back); border-radius: 10px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.3);
        }

        .letter {
            position: absolute; top: 10px; left: 10px;
            width: 300px; height: 180px;
            background: white; border-radius: 5px;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Caveat', cursive; font-size: 2rem; color: var(--primary-text);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 2;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1) 0.5s;
        }

        .front {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            border-left: 160px solid var(--env-front-left);
            border-right: 160px solid var(--env-front-right);
            border-bottom: 100px solid var(--env-front-bottom);
            border-top: 100px solid transparent; border-radius: 0 0 10px 10px;
            z-index: 3; pointer-events: none;
        }

        .flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-left: 160px solid transparent; border-right: 160px solid transparent;
            border-top: 110px solid var(--env-flap); border-bottom: 90px solid transparent;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
            z-index: 4;
        }

        .heart-seal {
            position: absolute; top: 90px; left: 50%;
            transform: translateX(-50%); font-size: 3.5rem; z-index: 5;
            animation: pulse 1.5s infinite;
        }

        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-wrapper.open .heart-seal { display: none; }
        .envelope-wrapper.open .letter { transform: translateY(-120px) scale(1.1); z-index: 5; }
        .envelope-wrapper.open { cursor: default; }

        .hint {
            margin-top: 40px; font-size: 1.2rem; color: var(--primary-text);
            animation: pulse-text 2s infinite; font-weight: 500;
        }
        @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } }
        @keyframes pulse-text { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* --- 2. ฉากความทรงจำ --- */
        #memory-scene {
            z-index: 10; display: flex; flex-direction: column;
            align-items: center; width: 100%; max-width: 600px;
            opacity: 0; pointer-events: none;
            transition: opacity 2s ease;
            padding-bottom: 30px; /* เพิ่มพื้นที่ด้านล่างนิดนึง */
        }
        #memory-scene.visible { opacity: 1; pointer-events: all; }

        .memory-text {
            font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 400; line-height: 1.6;
            opacity: 0; transform: translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--primary-text); text-align: center; padding: 0 20px;
        }
        .memory-text.active { opacity: 1; transform: translateY(0); }
        .special-font { font-family: 'Caveat', cursive; font-size: clamp(2.5rem, 7vw, 4.5rem); color: var(--env-flap); }

        .btn {
            background: linear-gradient(45deg, var(--env-flap), var(--primary-text));
            color: white; border: none; padding: 14px 40px; border-radius: 50px;
            font-size: 1.2rem; font-family: inherit; cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4); transition: transform 0.3s;
        }
        .btn:hover { transform: scale(1.05); }

        /* --- สไตล์สำหรับหน้าสุดท้าย --- */
        #final-action { 
            margin-top: 2rem; display: none; text-align: center; 
            animation: fadeInUp 1.5s forwards;
            display: flex; flex-direction: column; align-items: center; /* จัดให้อยู่กึ่งกลาง */
        }
        /* สไตล์รูปภาพปิดท้าย */
        .final-img {
            max-width: 85%; /* กว้างไม่เกิน 85% ของจอ */
            max-height: 35vh; /* สูงไม่เกิน 35% ของจอ */
            width: auto; height: auto;
            border-radius: 20px; /* ขอบมน */
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.5); /* เงาสวยๆ */
            margin-bottom: 1.5rem; /* เว้นระยะห่างจากข้อความ */
            object-fit: cover;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 3. ดอกไม้และหัวใจเต็มจอ --- */
        .particle {
            position: absolute; top: -10%; pointer-events: none;
            animation: fall linear forwards; z-index: 10;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
        #player { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; top: 0; left: 0; }
    </style>
</head>
<body>

    <main id="delivery-scene">
        <div class="envelope-wrapper" id="envelope" onclick="app.openLetter()">
            <div class="envelope"></div>
            <div class="letter">To My Wa...</div>
            <div class="front"></div>
            <div class="flap"></div>
            <div class="heart-seal">💖</div>
        </div>
        <p class="hint" id="hint-text">มีจดหมายและดอกไม้มาส่งให้วา... แตะเปิดนะครับ</p>
    </main>

    <div id="player"></div>

    <section id="memory-scene">
        <div style="min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;">
            <p id="display-text" class="memory-text"></p>
        </div>
        
        <div id="final-action" style="display: none;"> <img src="image_6.png" alt="My Lovely Wa" class="final-img">
            
            <p style="margin-bottom: 1.5rem; font-size: 1.2rem; color: #594d4d;">วาคือของขวัญที่ดีที่สุดของเค้าเลยนะ</p>
            <button class="btn" onclick="app.finishSurprise()">รักวานะคับ 💖</button>
        </div>
    </section>

    <script>
        const app = {
            config: { videoId: 'mGUjVbsYG6E', textSpeed: 4500, maxParticles: 40 },
            
            memories: [
                { type: 'text', content: "วาครับ..." },
                { type: 'text', content: "เห็นคนอื่นได้ดอกไม้กัน วาก็อยากได้ใช่ไหม?" },
                { type: 'text', content: "ถึงปีนี้เค้าจะยังไปส่งดอกไม้ให้วาด้วยตัวเองไม่ได้..." },
                { type: 'image', content: "image_7.png" }, // รูปวา
                { type: 'text', content: "แต่เค้าตั้งใจทำ 'สวนดอกไม้ดิจิทัล' นี้มาให้วานะ" },
                { type: 'text', content: "ดอกไม้ในจอนี้... จะไม่มีวันเหี่ยว เหมือนความรักของเค้าเลย" },
                { type: 'image', content: "image_8.png" }, // รูปวาวา
                { type: 'text', content: "ขอบคุณนะที่รอเค้า และอยู่ข้างกันเสมอ" },
                { type: 'text', content: "สัญญาว่าปีหน้า จะเอาช่อโตๆ ไปให้ด้วยตัวเองแน่นอน" },
                { type: 'text', content: "<span class='special-font'>Happy Valentine's Day, My Wa.</span>" }
            ],
            
            currentIndex: 0,
            player: null,
            isOpened: false,

            init: function() {
                const style = document.createElement('style');
                style.innerHTML = `
                    .memory-img { max-width: 85%; max-height: 45vh; border-radius: 20px; box-shadow: 0 15px 30px rgba(255, 77, 109, 0.4); opacity: 0; transform: scale(0.9); transition: all 1s ease; display: none; margin: 0 auto; }
                    .memory-img.active { opacity: 1; transform: scale(1); display: block; }
                `;
                document.head.appendChild(style);

                document.getElementById('display-text').insertAdjacentHTML('afterend', '<img id="display-image" class="memory-img" src="" alt="Memory">');

                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => {
                    this.player = new YT.Player('player', {
                        height: '1', width: '1', videoId: this.config.videoId,
                        playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1, 'loop': 1, 'playlist': this.config.videoId }
                    });
                };

                setInterval(() => this.createParticle(), 300);
            },

            openLetter: function() {
                if (this.isOpened) return;
                this.isOpened = true;
                document.getElementById('envelope').classList.add('open');
                document.getElementById('hint-text').style.display = 'none';

                if (this.player && typeof this.player.playVideo === 'function') {
                    this.player.unMute(); this.player.setVolume(100); this.player.playVideo();
                }

                setTimeout(() => {
                    const scene1 = document.getElementById('delivery-scene');
                    const scene2 = document.getElementById('memory-scene');
                    scene1.style.opacity = '0';
                    setTimeout(() => {
                        scene1.style.display = 'none';
                        scene2.classList.add('visible');
                        this.showNextMemory();
                        setInterval(() => this.createParticle(), 150);
                    }, 1000);
                }, 2500);
            },

            showNextMemory: function() {
                const textEl = document.getElementById('display-text');
                const imgEl = document.getElementById('display-image');
                const finalAction = document.getElementById('final-action');

                if (this.currentIndex < this.memories.length) {
                    textEl.classList.remove('active');
                    imgEl.classList.remove('active');
                    
                    setTimeout(() => {
                        const item = this.memories[this.currentIndex];
                        if (item.type === 'text') {
                            textEl.innerHTML = item.content;
                            textEl.style.display = 'block'; imgEl.style.display = 'none';
                            setTimeout(() => textEl.classList.add('active'), 50);
                        } else if (item.type === 'image') {
                            imgEl.src = item.content;
                            imgEl.style.display = 'block'; textEl.style.display = 'none';
                            setTimeout(() => imgEl.classList.add('active'), 50);
                        }
                        this.currentIndex++;
                        const delay = item.type === 'image' ? 5000 : this.config.textSpeed;
                        setTimeout(() => this.showNextMemory(), delay);
                    }, 1000);
                } else {
                    textEl.style.display = 'none'; imgEl.style.display = 'none';
                    // แสดงหน้าสุดท้าย (รูป + ปุ่ม)
                    finalAction.style.display = 'flex'; 
                }
            },

            createParticle: function() {
                const particles = ['🌸', '💖', '🌹', '✨', '🌷'];
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.innerHTML = particles[Math.floor(Math.random() * particles.length)];
                particle.style.left = `${Math.random() * 100}vw`;
                const size = Math.random() * 1.5 + 1;
                particle.style.fontSize = `${size}rem`;
                const duration = Math.random() * 4 + 4;
                particle.style.animationDuration = `${duration}s`;
                particle.style.opacity = (Math.random() * 0.6 + 0.4).toFixed(2);
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), duration * 1000);
            },

            finishSurprise: function() {
                alert('รักวานะครับคนเก่ง กลับไปคุยกับเค้าในแชทนะ 💖');
                window.close(); window.location.href = 'instagram://';
            }
        };
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
